openapi: 3.1.0
info:
  title: AI Product Image Studio BYOK Gateway (PROPOSED)
  version: 8.0.0
  description: >-
    Draft 8.0.0 adds local mask-evidence archive v3; gateway operations are unchanged from 7.1.0.
    The local-only gateway retains /api/v2 as the server-key route namespace;
    no deployed compatibility endpoint or production deployment is claimed.
    A default-disabled local seven-style scene subset has only synthetic-provider evidence.
    The owner configures the OpenAI key on their server; the browser never submits it.
    Source photo/brand QA remains local and requires human approval.
servers:
  - url: /api/v2
    description: Same-origin authenticated gateway
security:
  - AppSession: []
tags:
  - name: Session
  - name: Images
  - name: Diagnostics
paths:
  /health:
    get:
      security: []
      tags: [Diagnostics]
      operationId: health
      summary: Non-sensitive health probe
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        '503':
          description: Temporarily unavailable
  /auth/login:
    post:
      security: []
      tags: [Session]
      operationId: localOwnerLogin
      summary: Authenticate the local development owner without a provider key
      description: >-
        Local-loopback development only. Requires exact Origin and
        X-Studio-Request: login; a random owner access token is distinct from the
        server-configured provider key. Successful login rotates the app session.
      parameters:
        - name: X-Studio-Request
          in: header
          required: true
          schema:
            type: string
            const: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '200':
          description: Authenticated app session and session-bound CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSessionStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: App authentication changed while login was in flight
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Local session capacity reached
  /auth/session:
    get:
      tags: [Session]
      operationId: getLocalOwnerSession
      summary: Return the authenticated app session's CSRF token
      responses:
        '200':
          description: Authenticated app session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSessionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Session]
      operationId: logoutLocalOwner
      summary: Revoke the app session and its provider authorization
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: App and provider sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /session/connect:
    post:
      tags: [Session]
      operationId: connectProviderSession
      summary: Activate access to the server-configured provider for this app session
      description: >-
        Requires an authenticated caller and CSRF token. The owner configures the
        provider key on the self-hosted server, not through the browser. The
        server creates a short-lived provider authorization session and returns
        status only; it never returns or accepts a provider key in this request.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider:
                  type: string
                  const: openai
      responses:
        '201':
          description: Connected; provider-session cookie set by backend
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Provider authorization changed while the request was in flight
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Provider is not configured or the service is unavailable
  /session/status:
    get:
      tags: [Session]
      operationId: getProviderSessionStatus
      summary: Read provider configuration and connection status, never reveal the key
      description: >-
        Resolve only the provider authorization bound to the current app session.
        Return no-store; do not reveal whether another session is connected.
      responses:
        '200':
          description: Connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /session:
    delete:
      tags: [Session]
      operationId: disconnectProviderSession
      summary: Revoke the current provider authorization session, not the server key
      description: >-
        Revoke the provider authorization bound to the current app session on the
        server and expire its cookie. Logout or app-session expiry must also revoke
        it. Replayed old provider cookies and authorization from a previous login
        must be rejected. This does not remove or revoke the configured key.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Provider session revoked; server configuration and provider key remain unchanged
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /images/revision:
    get:
      tags: [Images]
      operationId: getImageReviewRevision
      summary: Read the durable global review revision before consent
      description: >-
        Fetch before enabling confirmation and capture the returned revision at the
        consent click. Each first durable acknowledgement or legacy wait review increments this revision
        once globally; replay of an existing receipt does not increment it.
        This read does not authorize or submit a provider request.
      security:
        - AppSession: []
          ProviderSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Current revision; response is no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reviewRevision]
                properties:
                  reviewRevision:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Feature disabled or journal unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /images/legacy-waits:
    get:
      tags: [Images]
      operationId: listLegacyWaits
      summary: List up to 100 earlier waits requiring external review
      security:
        - AppSession: []
          ProviderSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Pending records; review and fetch again when hasMore is true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [waits, hasMore]
                properties:
                  waits:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [clientAttemptId, retryNotBefore]
                      properties:
                        clientAttemptId: {type: string, format: uuid}
                        retryNotBefore: {type: integer, minimum: 0, maximum: 9007199254740991}
                  hasMore: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Feature disabled or journal unavailable}
  /images/attempts/{clientAttemptId}/legacy-wait-review:
    post:
      tags: [Images]
      operationId: reviewLegacyWait
      summary: Record explicit external review of one earlier provider wait
      description: >-
        The owner confirms externally that the provider wait has elapsed and billing
        was reviewed. This does not send a provider request. It creates a separate
        durable receipt and invalidates earlier consent. It does not prove elapsed time.
      security:
        - AppSession: []
          ProviderSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: clientAttemptId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewedProviderWait, reviewRevision]
              properties:
                reviewedProviderWait: {type: boolean, const: true}
                reviewRevision: {type: integer, minimum: 0, maximum: 9007199254740991}
      responses:
        '200':
          description: Durable review receipt
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clientAttemptId, retryNotBefore, reviewedAt]
                properties:
                  clientAttemptId: {type: string, format: uuid}
                  retryNotBefore: {type: integer, minimum: 0, maximum: 9007199254740991}
                  reviewedAt: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Stale review revision or non-reviewable attempt}
        '503': {description: Feature disabled or journal unavailable}
  /images/approvals:
    post:
      tags: [Images]
      operationId: authorizeImageAttempt
      summary: Create a short-lived authorization for one explicitly reviewed attempt
      description: >-
        Called after the user reviews and confirms the exact chargeable attempt
        and cost disclosure. Bind the authorization to the current app and
        provider sessions, clientAttemptId and a server-computed canonical digest
        of the entire validated attempt payload. Do not send a provider request.
        Only the browser-side user confirmation flow may request this approval.
        Pi must not receive browser session, CSRF or approval credentials or gain
        approval-issuance authority; the trusted gateway mediates approved work.
        The approval is not proof of human intent if the frontend is compromised.
        Keep the approval secret out of agent context, logs and persistent browser
        storage. Return no-store. The server must not rely on client estimates as
        authoritative pricing or on the approval alone as authentication.
        The submitted reviewRevision must equal the current global revision;
        a mismatch returns APPROVAL_STALE as a definitive pre-send failure and
        requires fresh consent, not an automatic retry.
      security:
        - AppSession: []
          ProviderSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageAttemptRequest'
      responses:
        '201':
          description: One-use authorization created without a provider request
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptApproval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
  /images/attempts/{clientAttemptId}/acknowledgement:
    post:
      tags: [Images]
      operationId: acknowledgeImageAttempt
      summary: Record explicit review of a previously ambiguous attempt
      description: >-
        Records a durable, idempotent acknowledgement without making or authorizing
        a provider request. UNKNOWN requires its matching owned in-flight marker and
        durable result; a missing, legacy or mismatched marker is not recoverable.
        A durable definitive result may be acknowledged even if its marker is
        missing; cleanup removes only its matching marker. A new-format definitive
        result without a durable cleanup record or acknowledgement blocks new
        attempts globally, including after restart. Replay returns the original
        receipt and never clears another attempt's marker.
        The reservation and recorded outcome remain immutable; a new request needs
        a new UUID and a separate explicit authorization. The local UNKNOWN outcome
        remains UNKNOWN. A journal failure leaves the client blocked; replay is safe.
      security:
        - AppSession: []
          ProviderSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: clientAttemptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [acknowledgePossibleCharge]
              properties:
                acknowledgePossibleCharge:
                  type: boolean
                  const: true
      responses:
        '200':
          description: Durable original acknowledgement receipt
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [clientAttemptId, recordedOutcome, acknowledgedAt]
                properties:
                  clientAttemptId:
                    type: string
                    format: uuid
                  recordedOutcome:
                    type: string
                    enum: [UNKNOWN, DEFINITIVE_SUCCESS, DEFINITIVE_FAILURE]
                  acknowledgedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Attempt missing, unreviewable, or ownership cannot be proven
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          description: Feature disabled or journal unavailable; acknowledgement may be replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /images/generate:
    post:
      tags: [Images]
      operationId: generateImage
      summary: Submit one explicit, possibly chargeable image attempt
      description: >-
        P0 synchronous contract. One request represents one Attempt; a style job may
        require multiple separately disclosed stages. A network timeout after
        submission may have billed; client MUST mark UNKNOWN and MUST NOT auto-retry.
        STRICT may call only generate_scene and locally composite original product.
        The server checks the one-use approval against the current app/provider
        sessions and canonical request digest. X-Client-Request-Id MUST equal
        clientAttemptId. Before sending, the gateway atomically consumes the approval
        and durably reserves the attempt per authenticated principal; a duplicate,
        including an already active attempt before reservation publication, returns
        409 CONFLICT with outcome UNKNOWN, not a claim about the original result.
        An invalid, expired, mismatched or consumed approval also returns CONFLICT
        with UNKNOWN; this does not assert that the identified attempt was not sent.
        An unrelated blocked attempt returns ATTEMPT_BUSY with outcome
        DEFINITIVE_FAILURE. Ambiguous outcomes remain UNKNOWN and must not be
        automatically resubmitted, even after restart.
        The submitted consent revision is checked again under the journal lock
        immediately before the provider request starts, serialized with reviews.
        A mismatch returns APPROVAL_STALE without a provider call.
        All authorization and input limits are enforced server-side.
      security:
        - AppSession: []
          ProviderSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ClientRequestId'
        - $ref: '#/components/parameters/AttemptApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageAttemptRequest'
      responses:
        '200':
          description: Definitively completed provider request; image not yet QA-approved
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
            X-Studio-Cleanup-Pending:
              $ref: '#/components/headers/StudioCleanupPending'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAttemptResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate attempt or invalid, expired, mismatched or consumed approval returns CONFLICT with UNKNOWN; an unrelated blocked attempt returns ATTEMPT_BUSY with DEFINITIVE_FAILURE, or consent may be stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: Rate limit reached; a definitive provider limit may require cleanup review
          headers:
            Retry-After:
              schema:
                type: string
              description: Minimum delay in seconds when the provider supplies a valid bounded value.
            X-Studio-Cleanup-Pending:
              $ref: '#/components/headers/StudioCleanupPending'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Definitive provider rejection
          headers:
            X-Studio-Cleanup-Pending:
              $ref: '#/components/headers/StudioCleanupPending'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          $ref: '#/components/responses/UnknownTimeout'
        '503':
          description: Journal unavailable or pre-send marker may require manual recovery (RECOVERY_REQUIRED); no provider request was sent
          headers:
            X-Studio-Cleanup-Pending:
              $ref: '#/components/headers/StudioCleanupPending'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  headers:
    StudioCleanupPending:
      description: Present as 1 when a definitive outcome was durably recorded but cleanup could not be established, or when a provider retry delay cannot be represented safely and requires external review. Preserve the outcome and image; block further generation globally and require explicit acknowledgement before continuing.
      schema:
        type: string
        enum: ['1']
  securitySchemes:
    AppSession:
      type: apiKey
      in: cookie
      name: app_session
      description: Authenticated first-party user identity session; provider choice TBD
    ProviderSession:
      type: apiKey
      in: cookie
      name: provider_session
      description: Short-lived provider authorization bound to the authenticated app session; HttpOnly Secure SameSite=Strict
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
      description: CSRF protection bound to authenticated principal
    ClientRequestId:
      name: X-Client-Request-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Correlation/duplicate-request reservation before provider send; for /images/generate it MUST equal clientAttemptId. Not an OpenAI idempotency guarantee.
    AttemptApprovalId:
      name: X-Attempt-Approval
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Cryptographically random one-use session-bound approval; never an OpenAI key or idempotency guarantee
  schemas:
    AppSessionStatus:
      type: object
      additionalProperties: false
      required: [authenticated, csrfToken]
      properties:
        authenticated:
          type: boolean
          const: true
        csrfToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    SessionStatus:
      type: object
      additionalProperties: false
      required: [connected, configured, provider, expiresAt]
      properties:
        connected:
          type: boolean
        configured:
          type: boolean
          description: Whether a server-side key is configured; does not verify provider access or validity
        provider:
          type: string
          const: openai
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Provider authorization expiry, not server-key expiry
    AttemptApproval:
      type: object
      additionalProperties: false
      required: [approvalId, expiresAt]
      properties:
        approvalId:
          type: string
          format: uuid
          description: Cryptographically random opaque one-use authorization identifier
        expiresAt:
          type: string
          format: date-time
          description: Authorization expiry enforced on submission
    ImageAttemptRequest:
      type: object
      additionalProperties: false
      required:
        - clientAttemptId
        - productId
        - styleId
        - presetVersion
        - sceneContext
        - lockMode
        - operation
        - model
        - quality
        - size
        - prompt
        - promptVersion
        - sourceAssetHashes
        - estimatedUSD
        - reviewRevision
        - outputFormat
      properties:
        reviewRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Global revision captured when the user confirmed this exact attempt
        clientAttemptId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        styleId:
          type: string
          enum: [studio, hero, lifestyle, flat_lay, macro, ugc, billboard]
        presetVersion:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
          description: Exact immutable preset version bound into the one-use approval
        sceneContext:
          type: object
          additionalProperties: false
          required: [productName, category, confirmedFacts, sourceView]
          description: Explicitly selected confirmed facts and product context sent to the provider as quoted data; gateway independently reconstructs the permitted prompt.
          properties:
            productName:
              type: string
              maxLength: 300
            category:
              type: string
              maxLength: 100
            confirmedFacts:
              type: array
              maxItems: 200
              items:
                type: string
                minLength: 1
                maxLength: 1102
            sourceView:
              type: string
              enum: [TOP, OTHER, UNKNOWN]
        lockMode:
          type: string
          enum: [STRICT, BALANCED, CREATIVE]
        operation:
          type: string
          enum: [generate_scene, reference_edit, concept]
          description: STRICT MUST use generate_scene; cross-field enforcement is server-side
        model:
          type: string
          enum: [gpt-image-2.5-flare, gpt-image-2.5-sunburst]
        quality:
          type: string
          enum: [low, medium, high, xhigh, max, auto]
        size:
          type: string
          pattern: '^(auto|[1-9][0-9]{2,3}x[1-9][0-9]{2,3})$'
          description: Gateway must validate live provider pixel count, multiples-of-16 and aspect ratio
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        promptVersion:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
        sourceAssetHashes:
          type: array
          minItems: 0
          maxItems: 16
          items:
            type: string
            pattern: '^[a-f0-9]{64}$'
        imageDataBase64:
          type: string
          maxLength: 16777216
          description: Optional reference-image payload (JPEG/PNG/WebP), no data URL prefix. P0 gateway size caps apply
        imageMimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        estimatedUSD:
          type: string
          pattern: '^\d+\.\d{1,6}$'
          description: Soft user-visible estimate only; never actual charge guarantee
        maxEstimatedUSD:
          type: string
          pattern: '^\d+\.\d{1,6}$'
          description: User's per-attempt soft estimate threshold, not a provider charge cap.
        softLimitOverride:
          type: boolean
          const: true
          description: Required only when the estimate exceeds maxEstimatedUSD. Explicit approval for this attempt only; included in the one-use approval binding and cannot override the gateway owner's estimate guard.
        sessionPriorUSD:
          type: string
          pattern: '^\d{1,9}\.\d{1,6}$'
          description: Client-reported conservative sum of estimates for the browser-tab budget session before this attempt; not verified provider spend.
        sessionLimitUSD:
          type: string
          pattern: '^\d{1,9}\.\d{1,6}$'
          description: Optional client-reported session soft estimate threshold; requires sessionPriorUSD and is not an account-wide provider cap.
        sessionLimitOverride:
          type: boolean
          const: true
          description: Required only if sessionPriorUSD plus estimatedUSD exceeds sessionLimitUSD; single attempt only and bound to its approval.
        outputFormat:
          type: string
          enum: [png, jpeg, webp]
          default: png
    ImageAttemptResult:
      type: object
      additionalProperties: false
      required: [clientAttemptId, outcome, model, image, usage, observedUSD, providerRequestId]
      properties:
        clientAttemptId:
          type: string
          format: uuid
        outcome:
          type: string
          const: DEFINITIVE_SUCCESS
        model:
          type: string
        providerRequestId:
          type: [string, 'null']
        image:
          type: object
          additionalProperties: false
          required: [mimeType, dataBase64, width, height]
          properties:
            mimeType:
              type: string
              enum: [image/png, image/jpeg, image/webp]
            dataBase64:
              type: string
              minLength: 1
              description: Browser decodes and validates bounds; server should avoid duplicate memory copies
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
        usage:
          type: [object, 'null']
          additionalProperties: true
          description: Allowlisted nonnegative provider token counters when available and internally consistent; null does not mean zero tokens. Observed billing remains unknown until rates and usage are reliably reconciled.
        observedUSD:
          type: [string, 'null']
          pattern: '^\d+\.\d{1,6}$'
          description: Snapshot-based calculation only when complete supported usage details are present; otherwise null. This is not the provider invoice.
        pricingSnapshot:
          type: string
          maxLength: 200
          description: Snapshot date, route and rates used when observedUSD is calculated.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, requestId, outcome]
          properties:
            code:
              type: string
              enum: [INVALID_INPUT, UNAUTHENTICATED, FORBIDDEN, RATE_LIMITED, PROVIDER_LIMIT, CONFLICT, ATTEMPT_BUSY, APPROVAL_STALE, PAYLOAD_TOO_LARGE, PROVIDER_ERROR, UPSTREAM_UNKNOWN, UNAVAILABLE, RECOVERY_REQUIRED, NOT_FOUND, INTERNAL_ERROR]
            message:
              type: string
              maxLength: 500
            retryable:
              type: boolean
              description: May be true only if safe and explicitly approved by user; NEVER auto-retry after ambiguous send
            requestId:
              type: string
            outcome:
              type: string
              enum: [DEFINITIVE_FAILURE, UNKNOWN]
              description: UNKNOWN means this response cannot establish the identified attempt's original outcome; DEFINITIVE_FAILURE indicates a definite failure, not a claim about a different or previously submitted attempt.
            retryAfterSeconds:
              type: [integer, 'null']
              minimum: 0
  responses:
    BadRequest:
      description: Invalid input, prompt, style or provider parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing authenticated user session or provider authorization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Caller forbidden or CSRF failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Duplicate attempt or inconsistent job state; no duplicate provider call
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Source image too large / decompression limits
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: User/app/provider limit reached
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamError:
      description: Provider error; outcome depends on whether request definitely reached provider
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnknownTimeout:
