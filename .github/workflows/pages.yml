name: Deploy static preview to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Verify upload-to-download and offline behavior
        run: node --test tests/browser/pages-preview.test.mjs tests/browser/automatic-reference.test.mjs
        working-directory: app
      - name: Verify automatic cutout with the bundled model
        run: node --test tests/browser/pages-preview.test.mjs
        working-directory: app
        env:
          STUDIO_MATTE_SMOKE: '1'
      - name: Build repository-scoped static preview
        working-directory: app
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --mode pages --base "/${REPOSITORY_NAME}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
